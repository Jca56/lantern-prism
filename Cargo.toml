[workspace]
resolver = "3"
members = [
    "crates/prism-math",
    "crates/prism-core",
    "crates/prism-props",
    "crates/prism-geom",
    "crates/prism-mesh",
    "crates/prism-eval",
    "crates/prism-doc",
    "crates/prism-ops",
    "crates/prism-text",
    "crates/prism-render",
    "crates/prism-ui",
    "crates/prism-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alva"]

[workspace.dependencies]
prism-math = { path = "crates/prism-math" }
prism-core = { path = "crates/prism-core" }
prism-props = { path = "crates/prism-props" }
prism-geom = { path = "crates/prism-geom" }
prism-mesh = { path = "crates/prism-mesh" }
prism-eval = { path = "crates/prism-eval" }
prism-doc = { path = "crates/prism-doc" }
prism-ops = { path = "crates/prism-ops" }
prism-text = { path = "crates/prism-text" }
prism-render = { path = "crates/prism-render" }
prism-ui = { path = "crates/prism-ui" }
wgpu = "28"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
